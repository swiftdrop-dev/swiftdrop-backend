services:
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: swiftdrop-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swiftdrop-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swiftdrop-rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: swiftdrop-auth-service
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      PGHOST: ${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: auth_db
      PGUSER: ${AUTH_DB_USERNAME:-${PGUSER:-neondb_owner}}
      PGPASSWORD: ${AUTH_DB_PASSWORD:-${PGPASSWORD:-}}
      PGSSLMODE: ${PGSSLMODE:-require}
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/auth_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      DB_USERNAME: ${AUTH_DB_USERNAME:-${PGUSER:-neondb_owner}}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-${PGPASSWORD:-}}
      AUTH_DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/auth_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-${PGUSER:-neondb_owner}}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-${PGPASSWORD:-}}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_VERIFY_ONLINE: ${GOOGLE_VERIFY_ONLINE:-false}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - swiftdrop-network

  parcel-service:
    build:
      context: ./services/parcel-service
      dockerfile: Dockerfile
    container_name: swiftdrop-parcel-service
    ports:
      - "127.0.0.1:${PARCEL_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      PGHOST: ${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PARCEL_DB_NAME:-parcel_db}
      PGUSER: ${PARCEL_DB_USER:-${PGUSER:-neondb_owner}}
      PGPASSWORD: ${PARCEL_DB_PASSWORD:-${PGPASSWORD:-}}
      PGSSLMODE: ${PGSSLMODE:-require}
      PARCEL_DB_URL: ${PARCEL_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/parcel_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      PARCEL_DB_USERNAME: ${PARCEL_DB_USERNAME:-${PGUSER:-neondb_owner}}
      PARCEL_DB_PASSWORD: ${PARCEL_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_DATASOURCE_URL: ${PARCEL_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/parcel_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      SPRING_DATASOURCE_USERNAME: ${PARCEL_DB_USERNAME:-${PGUSER:-neondb_owner}}
      SPRING_DATASOURCE_PASSWORD: ${PARCEL_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PARCEL_OTP_HMAC_SECRET: ${PARCEL_OTP_HMAC_SECRET:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - swiftdrop-network

