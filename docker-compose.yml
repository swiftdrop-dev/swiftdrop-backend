services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swiftdrop-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: swiftdrop-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://localhost:5432/auth_db}
      DB_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    networks:
      - swiftdrop-network

  merchant-service:
    build:
      context: ./services/merchant-service
      dockerfile: Dockerfile
    container_name: swiftdrop-merchant-service
    ports:
      - "${MERCHANT_SERVICE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: ${MERCHANT_DB_URL:-jdbc:postgresql://localhost:5432/merchantdb}
      SPRING_DATASOURCE_USERNAME: ${MERCHANT_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${MERCHANT_DB_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MERCHANT_SECURITY_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - swiftdrop-network

  dispatch-service:
    build:
      context: ./services/dispatch-service
      dockerfile: Dockerfile
    container_name: swiftdrop-dispatch-service
    ports:
      - "${DISPATCH_SERVICE_PORT:-8085}:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: ${DISPATCH_DB_URL:-jdbc:postgresql://localhost:5432/dispatcherdb}
      SPRING_DATASOURCE_USERNAME: ${DISPATCH_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DISPATCH_DB_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - swiftdrop-network

  parcel-service:
    build:
      context: ./services/parcel-service
      dockerfile: Dockerfile
    container_name: swiftdrop-parcel-service
    ports:
      - "${PARCEL_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      PGHOST: ${PGHOST:-localhost}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PARCEL_DB_NAME:-parcel_db}
      PGUSER: ${PARCEL_DB_USER:-postgres}
      PGPASSWORD: ${PARCEL_DB_PASSWORD:-postgres}
      PGSSLMODE: ${PGSSLMODE:-prefer}
    networks:
      - swiftdrop-network

  courier-service:
    build:
      context: ./services/courier-service
      dockerfile: Dockerfile
    container_name: swiftdrop-courier-service
    ports:
      - "${COURIER_SERVICE_PORT:-8086}:8086"
    environment:
      SERVER_PORT: 8086
      PGHOST: ${PGHOST:-localhost}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${COURIER_DB_NAME:-courier_db}
      PGUSER: ${COURIER_DB_USER:-postgres}
      PGPASSWORD: ${COURIER_DB_PASSWORD:-postgres}
      PGSSLMODE: ${PGSSLMODE:-prefer}
    networks:
      - swiftdrop-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: swiftdrop-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MERCHANT_SERVICE_URL: http://merchant-service:8084
      DISPATCH_SERVICE_URL: http://dispatch-service:8085
      AUTH_SERVICE_URL: http://auth-service:8081
      PARCEL_SERVICE_URL: http://parcel-service:8082
      COURIER_SERVICE_URL: http://courier-service:8086
    depends_on:
      - auth-service
      - merchant-service
      - dispatch-service
    networks:
      - swiftdrop-network

  frontend:
    build:
      context: ../swiftdrop-frontend
      dockerfile: Dockerfile
    container_name: swiftdrop-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - swiftdrop-network

networks:
  swiftdrop-network:
    driver: bridge
