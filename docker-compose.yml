  frontend:
    build:
      context: ../swiftdrop-frontend
      dockerfile: Dockerfile
    container_name: swiftdrop-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - swiftdrop-network

volumes:
  postgres_data:
    driver: local

networks:
  swiftdrop-network:
    driver: bridge
