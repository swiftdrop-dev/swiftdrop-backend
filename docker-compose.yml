      MERCHANT_DB_USERNAME: ${MERCHANT_DB_USERNAME:-${PGUSER:-neondb_owner}}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:-${PGPASSWORD:-}}
      MERCHANT_FLYWAY_USER: ${MERCHANT_FLYWAY_USER:-${MERCHANT_DB_USERNAME:-${PGUSER:-neondb_owner}}}
      MERCHANT_FLYWAY_PASSWORD: ${MERCHANT_FLYWAY_PASSWORD:-${MERCHANT_DB_PASSWORD:-${PGPASSWORD:-}}}
      SPRING_DATASOURCE_URL: ${MERCHANT_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/merchantdb?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      SPRING_DATASOURCE_USERNAME: ${MERCHANT_DB_USERNAME:-${PGUSER:-neondb_owner}}
      SPRING_DATASOURCE_PASSWORD: ${MERCHANT_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PARCEL_SERVICE_URL: http://parcel-service:8082
      PRICING_SERVICE_URL: http://pricing-service:8083
      SERVICES_PARCEL_URL: http://parcel-service:8082
      SERVICES_PRICING_URL: http://pricing-service:8083
      MERCHANT_WEBHOOK_ENCRYPTION_KEY: ${MERCHANT_WEBHOOK_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
