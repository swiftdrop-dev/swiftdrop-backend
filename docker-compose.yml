      PGUSER: ${PRICING_DB_USER:-${PGUSER:-neondb_owner}}
      PGPASSWORD: ${PRICING_DB_PASSWORD:-${PGPASSWORD:-}}
      PGSSLMODE: ${PGSSLMODE:-require}
      PRICING_DB_URL: ${PRICING_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/pricing_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      PRICING_DB_USERNAME: ${PRICING_DB_USERNAME:-${PGUSER:-neondb_owner}}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_DATASOURCE_URL: ${PRICING_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/pricing_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      SPRING_DATASOURCE_USERNAME: ${PRICING_DB_USERNAME:-${PGUSER:-neondb_owner}}
      SPRING_DATASOURCE_PASSWORD: ${PRICING_DB_PASSWORD:-${PGPASSWORD:-}}
      PARCEL_SERVICE_URL: http://parcel-service:8082
      SERVICES_PARCEL_URL: http://parcel-service:8082
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    healthcheck:
