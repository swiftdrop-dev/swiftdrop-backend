      TRACKING_DB_URL: ${TRACKING_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/tracking_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      TRACKING_DB_USERNAME: ${TRACKING_DB_USERNAME:-${PGUSER:-neondb_owner}}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_DATASOURCE_URL: ${TRACKING_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/tracking_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      SPRING_DATASOURCE_USERNAME: ${TRACKING_DB_USERNAME:-${PGUSER:-neondb_owner}}
      SPRING_DATASOURCE_PASSWORD: ${TRACKING_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
