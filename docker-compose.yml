      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${COURIER_DB_NAME:-courier_db}
      PGUSER: ${COURIER_DB_USER:-${PGUSER:-neondb_owner}}
      PGPASSWORD: ${COURIER_DB_PASSWORD:-${PGPASSWORD:-}}
      PGSSLMODE: ${PGSSLMODE:-require}
      COURIER_DB_URL: ${COURIER_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/courier_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      COURIER_DB_USERNAME: ${COURIER_DB_USERNAME:-${PGUSER:-neondb_owner}}
      COURIER_DB_PASSWORD: ${COURIER_DB_PASSWORD:-${PGPASSWORD:-}}
      SPRING_DATASOURCE_URL: ${COURIER_DB_URL:-jdbc:postgresql://${PGHOST:-ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:-5432}/courier_db?sslmode=${PGSSLMODE:-require}&channel_binding=require}
      SPRING_DATASOURCE_USERNAME: ${COURIER_DB_USERNAME:-${PGUSER:-neondb_owner}}
      SPRING_DATASOURCE_PASSWORD: ${COURIER_DB_PASSWORD:-${PGPASSWORD:-}}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
