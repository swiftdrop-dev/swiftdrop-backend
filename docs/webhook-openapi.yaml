openapi: 3.0.3
info:
  title: SwiftDrop local merchant webhooks
  version: 0.1.0
  description: Local-only test merchant identity. JWT integration is pending M1/M4.
servers:
  - url: http://127.0.0.1:8089/api/v1/merchant/webhooks
security:
  - LocalGuard: []
paths:
  /:
    get:
      summary: List subscriptions owned by the configured local merchant
      responses:
        '200': {description: Subscription array}
    post:
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionInput'}
      responses:
        '201': {description: Created subscription}
        '400': {description: Invalid URL or events}
  /{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      summary: Delete an unused owned subscription; preserve subscriptions with delivery history
      responses:
        '204': {description: Deleted}
        '404': {description: Missing or unowned}
        '409': {description: Delivery history exists; disable instead}
    get:
      summary: Read an owned subscription
      responses:
        '200': {description: Subscription}
        '404': {description: Missing or unowned}
    patch:
      summary: Update callbackUrl and eventTypes, or send isActive alone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/SubscriptionInput'}
                - type: object
                  required: [isActive]
                  properties:
                    isActive: {type: boolean}
      responses:
        '200': {description: Updated subscription}
        '400': {description: Invalid input}
        '404': {description: Missing or unowned}
  /{id}/events:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Queue a sample status event for the owned local receiver subscription
      responses:
        '202': {description: Object containing id and PENDING status}
        '400': {description: Destination not the local receiver}
        '404': {description: Missing or unowned}
        '409': {description: Subscription disabled}
        '503': {description: Signing secret missing}
  /deliveries:
    get:
      summary: Paginated delivery log for the configured merchant
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, PROCESSING, RETRYING, SUCCESS, DEAD_LETTER]}
      responses:
        '200': {description: Object containing items, total, page and size}
        '400': {description: Invalid filter or pagination}
  /deliveries/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Owned delivery, payload, and attempt history
      responses:
        '200': {description: Object containing delivery, payload and attempts}
        '404': {description: Missing or unowned}
  /deliveries/{id}/replay:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Replay a dead-letter delivery on an active owned subscription
      responses:
        '202': {description: PENDING status; original event and history preserved}
        '404': {description: Missing or unowned}
        '409': {description: Already queued, successful, or subscription disabled}
components:
  securitySchemes:
    LocalGuard:
      type: apiKey
      in: header
      name: X-SwiftDrop-Local
      description: Must be true. Development guard only; not merchant authentication.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    SubscriptionInput:
      type: object
      required: [callbackUrl, eventTypes]
      properties:
        callbackUrl:
          type: string
          maxLength: 2048
          example: http://127.0.0.1:9091/webhooks/swiftdrop
        eventTypes:
          type: array
          minItems: 1
          maxItems: 1
          items: {type: string, enum: [parcel.status.changed]}
