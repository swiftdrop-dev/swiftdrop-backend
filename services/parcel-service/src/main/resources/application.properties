spring.application.name=parcel-service
server.port=8082
spring.profiles.default=demo
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
swiftdrop.auth.jwt-secret=${JWT_SECRET:}
swiftdrop.auth.issuer=${JWT_ISSUER:swiftdrop}
swiftdrop.auth.audience=${JWT_AUDIENCE:swiftdrop-api}
swiftdrop.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
swiftdrop.pricing.base-url=${PRICING_BASE_URL:http://localhost:8083}
