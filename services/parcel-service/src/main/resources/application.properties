spring.application.name=parcel-service
server.port=8082

# Neon PostgreSQL Configuration
spring.datasource.url=${PARCEL_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/${PGDATABASE:parcel_db}?sslmode=${PGSSLMODE:require}&channel_binding=require}}
spring.datasource.username=${PARCEL_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${PGUSER:neondb_owner}}}
spring.datasource.password=${PARCEL_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Keep schema changes explicit and Parcel Service-owned through Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
# JWT Secret
jwt.secret=${JWT_SECRET}

# Local OTP Delivery Gateway (for local/dev environment)
parcel.otp.local-delivery.enabled=${PARCEL_OTP_LOCAL_DELIVERY_ENABLED:true}

