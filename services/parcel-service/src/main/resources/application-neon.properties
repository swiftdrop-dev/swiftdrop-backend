# Opt in with SPRING_PROFILES_ACTIVE=neon; default scaffold remains unchanged.
spring.autoconfigure.exclude=
spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE:neondb}?sslmode=${PGSSLMODE:require}&channelBinding=${PGCHANNELBINDING:require}&connectTimeout=15
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
