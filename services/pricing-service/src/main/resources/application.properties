spring.application.name=pricing-service
server.port=${SERVER_PORT:8083}

# ── Database ──────────────────────────────────────────────────
# Supports local Postgres, Docker Compose, or Neon Cloud Postgres
spring.datasource.url=${PRICING_DB_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pricing_db}?sslmode=${PGSSLMODE:prefer}}}
spring.datasource.username=${PRICING_DB_USERNAME:${DB_USERNAME:${PGUSER:postgres}}}
spring.datasource.password=${PRICING_DB_PASSWORD:${DB_PASSWORD:${PGPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway Migrations ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Downstream Microservice Clients ───────────────────────────
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}

# ── Actuator & OpenAPI ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
