spring.application.name=pricing-service
server.port=${SERVER_PORT:8083}

# ── Database ──────────────────────────────────────────────────
# Supports Neon Cloud Postgres or local override
spring.datasource.url=${PRICING_DB_URL:${DB_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/${PGDATABASE:pricing_db}?sslmode=${PGSSLMODE:require}&channel_binding=require}}
spring.datasource.username=${PRICING_DB_USERNAME:${DB_USERNAME:${PGUSER:neondb_owner}}}
spring.datasource.password=${PRICING_DB_PASSWORD:${DB_PASSWORD:${PGPASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway Migrations ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Downstream Microservice Clients ───────────────────────────
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}

# ── Actuator & OpenAPI ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── JWT Security ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
