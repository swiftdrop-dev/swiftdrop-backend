spring.application.name=dispatch-service
server.port=8085

# JWT verification uses the Auth Service shared secret; no fallback is allowed.
jwt.secret=${JWT_SECRET:}

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DISPATCH_DB_URL:}
spring.datasource.username=${DISPATCH_DB_USERNAME:}
spring.datasource.password=${DISPATCH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DISPATCH_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${DISPATCH_FLYWAY_PASSWORD:${spring.datasource.password}}
