spring.application.name=dispatch-service
server.port=8085

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DISPATCH_DB_URL:jdbc:postgresql://ep-long-tooth-aod34x2e-pooler.c-2.ap-southeast-1.aws.neon.tech/dispatcherdb?sslmode=require}
spring.datasource.username=${DISPATCH_DB_USERNAME:neondb_owner}
spring.datasource.password=${DISPATCH_DB_PASSWORD:npg_mUaYDup4WMP8}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DISPATCH_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${DISPATCH_FLYWAY_PASSWORD:${spring.datasource.password}}
