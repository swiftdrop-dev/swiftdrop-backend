spring.application.name=dispatch-service
server.port=8085

# JWT verification uses the Auth Service shared secret; no fallback is allowed.
jwt.secret=${JWT_SECRET:}

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DISPATCH_DB_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/dispatcherdb?sslmode=${PGSSLMODE:require}&channel_binding=require}
spring.datasource.username=${DISPATCH_DB_USERNAME:${PGUSER:neondb_owner}}
spring.datasource.password=${DISPATCH_DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DISPATCH_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${DISPATCH_FLYWAY_PASSWORD:${spring.datasource.password}}

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
