spring.application.name=dispatch-service
server.port=8085

# Database Configuration (Neon PostgreSQL / Local Fallback)
spring.datasource.url=${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/dispatch_db}
spring.datasource.username=${DISPATCH_DB_USERNAME:postgres}
spring.datasource.password=${DISPATCH_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DISPATCH_FLYWAY_USER:${DISPATCH_MIGRATION_USER:${spring.datasource.username}}}
spring.flyway.password=${DISPATCH_FLYWAY_PASSWORD:${DISPATCH_MIGRATION_PASSWORD:${spring.datasource.password}}}
