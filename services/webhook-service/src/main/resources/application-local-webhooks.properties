# Explicitly opt-in development mode. Never activate this profile in deployment.
server.address=127.0.0.1
spring.flyway.enabled=true
spring.flyway.schemas=webhooks_dev
spring.flyway.default-schema=webhooks_dev
spring.flyway.locations=classpath:db/local-migration
management.health.rabbit.enabled=false
webhooks.local.merchant-id=${WEBHOOK_LOCAL_MERCHANT_ID:dev-nathasha}
webhooks.local.receiver-url=http://127.0.0.1:9091/webhooks/swiftdrop
webhooks.local.signing-secret=${WEBHOOK_LOCAL_SIGNING_SECRET:}
webhooks.broker.enabled=${WEBHOOK_BROKER_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
