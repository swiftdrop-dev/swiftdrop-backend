spring.application.name=webhook-service
server.port=${WEBHOOK_SERVICE_PORT:8089}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=${PGSSLMODE:require}&channelBinding=${PGCHANNELBINDING:require}&connectTimeout=10&socketTimeout=30&tcpKeepAlive=true
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.validation-timeout=3000
spring.sql.init.mode=never
spring.flyway.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
