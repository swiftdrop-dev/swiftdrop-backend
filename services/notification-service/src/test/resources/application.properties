spring.application.name=notification-service-test
server.port=0

spring.datasource.url=jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false

notification.provider.email.enabled=true
notification.provider.sms.enabled=true
notification.provider.simulation-mode=true
