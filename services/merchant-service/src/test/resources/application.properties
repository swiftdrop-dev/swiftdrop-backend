spring.application.name=merchant-service-test
server.port=0

# H2 in PostgreSQL Mode for Automated Test & Migration Verification
spring.datasource.url=jdbc:h2:mem:merchant_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway Database Migrations (Disabled in H2 unit tests since PostgreSQL pgcrypto/jsonb is native to Neon/Postgres)
spring.flyway.enabled=false

# Isolated test-only JWT verification key. Production requires JWT_SECRET.
merchant.security.jwt-secret=test-only-merchant-jwt-key-material-at-least-32-bytes

# Prevent actuator health checks from attempting a RabbitMQ connection in isolated tests.
management.health.rabbit.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

# Test Webhook Configuration
merchant.webhook.allow-localhost=true
merchant.webhook.allow-insecure-http=true
merchant.webhook.allowed-ports=80,443,8443,8080
merchant.webhook.encryption.key=dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1sb25nISE=

