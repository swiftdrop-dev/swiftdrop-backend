spring.application.name=merchant-service-test
server.port=0

# H2 in PostgreSQL Mode for Automated Test & Migration Verification
spring.datasource.url=jdbc:h2:mem:merchant_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway Database Migrations (Disabled in H2 unit tests since PostgreSQL pgcrypto/jsonb is native to Neon/Postgres)
spring.flyway.enabled=false

# JWT Test Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
