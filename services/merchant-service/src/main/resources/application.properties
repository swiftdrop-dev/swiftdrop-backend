spring.application.name=merchant-service
server.port=8084

# Auth Service JWT verification key; no fallback is permitted.
merchant.security.jwt-secret=${JWT_SECRET:}

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${MERCHANT_DB_URL:}
spring.datasource.username=${MERCHANT_DB_USERNAME:}
spring.datasource.password=${MERCHANT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MERCHANT_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${MERCHANT_FLYWAY_PASSWORD:${spring.datasource.password}}
