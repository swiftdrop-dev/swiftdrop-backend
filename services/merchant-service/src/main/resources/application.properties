spring.application.name=merchant-service
server.port=8084

# Database Configuration (Neon PostgreSQL / Local Fallback)
spring.datasource.url=${MERCHANT_DB_URL:jdbc:postgresql://localhost:5432/merchant_db}
spring.datasource.username=${MERCHANT_DB_USERNAME:postgres}
spring.datasource.password=${MERCHANT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MERCHANT_FLYWAY_USER:${MERCHANT_MIGRATION_USER:${spring.datasource.username}}}
spring.flyway.password=${MERCHANT_FLYWAY_PASSWORD:${MERCHANT_MIGRATION_PASSWORD:${spring.datasource.password}}}
