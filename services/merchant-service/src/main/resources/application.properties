spring.application.name=merchant-service
server.port=8084

# Auth Service JWT verification key; no fallback is permitted.
merchant.security.jwt-secret=${JWT_SECRET}

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${MERCHANT_DB_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/merchantdb?sslmode=${PGSSLMODE:require}&channel_binding=require}
spring.datasource.username=${MERCHANT_DB_USERNAME:${PGUSER:neondb_owner}}
spring.datasource.password=${MERCHANT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MERCHANT_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${MERCHANT_FLYWAY_PASSWORD:${spring.datasource.password}}

# Merchant Webhook Configuration
merchant.webhook.allow-localhost=${MERCHANT_WEBHOOK_ALLOW_LOCALHOST:false}
merchant.webhook.allow-insecure-http=${MERCHANT_WEBHOOK_ALLOW_INSECURE_HTTP:false}
merchant.webhook.allowed-ports=${MERCHANT_WEBHOOK_ALLOWED_PORTS:80,443,8443}
merchant.webhook.encryption.key=${MERCHANT_WEBHOOK_ENCRYPTION_KEY:}
merchant.webhook.timeout-seconds=10
merchant.webhook.retry.fixed-delay-ms=15000

# Downstream Service URLs
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}
services.pricing.url=${PRICING_SERVICE_URL:http://localhost:8083}

