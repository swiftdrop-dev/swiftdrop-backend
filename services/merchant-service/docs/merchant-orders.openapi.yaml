openapi: 3.0.3
info:
  title: SwiftDrop Merchant Orders (disabled pending M1/M2)
  version: 0.1.0
  description: Prepared façade contract. No live HTTP routes or M2 integration enabled. Parcel-service is authoritative.
security:
  - MerchantApiKey: []
paths:
  /api/v1/merchant/orders:
    post:
      summary: Create canonical parcel (orders:write required)
      description: Same merchant/key and same normalized payload replays original 201. Mismatched payload is 409. Unknown outcomes are not resent automatically. Keys are retained without automatic expiry.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrder'}
      responses:
        '201':
          description: Canonical parcel created, or original creation response replayed
          headers:
            Location:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        default: {$ref: '#/components/responses/Error'}
    get:
      summary: List owned parcels (orders:read required)
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/Status'}
        - in: query
          name: merchantOrderRef
          schema: {type: string, maxLength: 100}
        - in: query
          name: trackingNumber
          schema: {type: string, maxLength: 100}
        - in: query
          name: createdFrom
          schema: {type: string, format: date-time}
        - in: query
          name: createdTo
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: M2-filtered results sorted by createdAt DESC then id DESC
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [data,total,page,size]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
                  total: {type: integer, format: int64, minimum: 0}
                  page: {type: integer, minimum: 0}
                  size: {type: integer, minimum: 1, maximum: 100}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/merchant/orders/{id}:
    get:
      summary: Get owned canonical parcel (orders:read required)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Owned parcel; missing and unowned IDs both return 404
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    MerchantApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Exactly one M4 credential; current APPROVED merchant required. Never send in query/body.
  responses:
    Error:
      description: '400 validation; 401 invalid/unapproved credential; 403 scope; 404 missing/unowned; 409 idempotency conflict/in progress; 422 definitive M2 rejection; 502 upstream contract; 503 unavailable/uncertain; 504 timeout. In-progress includes Retry-After: 5. Default-disabled security can return container errors.'
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: string}
              message: {type: string}
  schemas:
    Status:
      type: string
      enum: [PENDING,ASSIGNED,PICKED_UP,IN_TRANSIT,OUT_FOR_DELIVERY,DELIVERED,FAILED,CANCELLED,RETURNED]
    Address:
      type: object
      required: [street,city,district]
      properties:
        street: {type: string, minLength: 1, maxLength: 300}
        city: {type: string, minLength: 1, maxLength: 100}
        district: {type: string, minLength: 1, maxLength: 100}
        postalCode: {type: string, maxLength: 20, nullable: true}
    Recipient:
      type: object
      required: [name,phone]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        phone: {type: string, pattern: '^[+0-9() .-]{7,32}$'}
    CreateOrder:
      type: object
      additionalProperties: false
      required: [merchantOrderRef,recipient,pickupAddress,deliveryAddress,description,weightKg,size,paymentMethod]
      properties:
        merchantOrderRef: {type: string, minLength: 1, maxLength: 100}
        recipient: {$ref: '#/components/schemas/Recipient'}
        pickupAddress: {$ref: '#/components/schemas/Address'}
        deliveryAddress: {$ref: '#/components/schemas/Address'}
        description: {type: string, minLength: 1, maxLength: 500}
        weightKg: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000, multipleOf: 0.001}
        size: {type: string, enum: [XS,SM,MD,LG,XL]}
        declaredValue: {type: number, minimum: 0, maximum: 999999999999.99, multipleOf: 0.01, nullable: true}
        fragile: {type: boolean, default: false}
        specialInstructions: {type: string, maxLength: 1000, nullable: true}
        paymentMethod: {type: string, enum: [COD,ONLINE]}
    Order:
      type: object
      required: [id,merchantOrderRef,trackingNumber,status,details,deliveryFee,totalFee,currency,createdAt]
      properties:
        id: {type: string, format: uuid}
        merchantOrderRef: {type: string}
        trackingNumber: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        details: {$ref: '#/components/schemas/CreateOrder'}
        deliveryFee: {type: number, minimum: 0}
        totalFee: {type: number, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        createdAt: {type: string, format: date-time}
