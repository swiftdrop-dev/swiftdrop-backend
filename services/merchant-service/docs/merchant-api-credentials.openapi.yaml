openapi: 3.0.3
info:
  title: SwiftDrop Merchant API Credential Management
  version: 0.2.0
  description: Prepared contract. All HTTP access remains denied until M1 integration. Human owner authentication is required; its transport is pending M1.
paths:
  /api/v1/merchant/me/api-keys:
    post:
      summary: Issue credential for an approved merchant owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          $ref: '#/components/responses/Issued'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      summary: List current owner's credential metadata
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Metadata only; no plaintext or digest
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Metadata'}
                  total: {type: integer, format: int64}
                  page: {type: integer}
                  size: {type: integer}
        default:
          $ref: '#/components/responses/Error'
  /api/v1/merchant/me/api-keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      summary: Atomically replace an active key and immediately revoke it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: {type: string, format: date-time, nullable: true}
      responses:
        '201':
          $ref: '#/components/responses/Issued'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/merchant/me/api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      summary: Idempotently revoke an owned key
      responses:
        '204':
          description: Revoked or already revoked
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    CredentialId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
  schemas:
    IssueRequest:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scopes:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 2
          items: {type: string, enum: ['orders:read', 'orders:write']}
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Future instant at most 90 days after issuance; defaults to 90 days.
    Metadata:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        publicId: {type: string}
        scopes:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
        replacementId: {type: string, format: uuid, nullable: true}
        state: {type: string, enum: [ACTIVE, EXPIRED, REVOKED]}
  responses:
    Issued:
      description: One-time secret; cannot be retrieved again
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            type: object
            properties:
              credential: {$ref: '#/components/schemas/Metadata'}
              apiKey: {type: string, description: Secret; never log or cache}
    Error:
      description: Business errors use code/message. Current HTTP security may return container error responses. Codes include invalid request, denied approval, missing owned credential, lifecycle conflict and unavailable identity.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: string}
              message: {type: string}
