spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# ── Environment Aliases & Fallbacks ───────────────────────────
DB_URL=${AUTH_DB_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:auth_db}?sslmode=${PGSSLMODE:prefer}}}
DB_USERNAME=${AUTH_DB_USERNAME:${DB_USERNAME:${PGUSER:postgres}}}
DB_PASSWORD=${AUTH_DB_PASSWORD:${DB_PASSWORD:${PGPASSWORD:postgres}}}
JWT_SECRET=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ──────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
