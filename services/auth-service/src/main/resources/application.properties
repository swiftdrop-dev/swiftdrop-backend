spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# ── Environment Aliases & Fallbacks ───────────────────────────
DB_URL=${AUTH_DB_URL:${DB_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/${PGDATABASE:auth_db}?sslmode=${PGSSLMODE:require}&channel_binding=require}}
DB_USERNAME=${AUTH_DB_USERNAME:${DB_USERNAME:${PGUSER:neondb_owner}}}
DB_PASSWORD=${AUTH_DB_PASSWORD:${DB_PASSWORD}}
JWT_SECRET=${JWT_SECRET}

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway Migrations ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ──────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ── Google OAuth 2.0 ──────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:}
google.verify-online=${GOOGLE_VERIFY_ONLINE:true}
google.jwks-url=${GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}

