spring.application.name=courier-service
server.port=8086

# Neon PostgreSQL Configuration
spring.datasource.url=${COURIER_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:ep-sparkling-smoke-bdghtf2s-pooler.c-8.us-east-2.aws.neon.tech}:${PGPORT:5432}/${PGDATABASE:courier_db}?sslmode=${PGSSLMODE:require}&channel_binding=require}}
spring.datasource.username=${COURIER_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${PGUSER:neondb_owner}}}
spring.datasource.password=${COURIER_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}}

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Secret
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}