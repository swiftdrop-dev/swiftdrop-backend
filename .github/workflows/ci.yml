name: SwiftDrop Backend CI

on:
  push:
    branches: [ main, dev, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test API Gateway
        working-directory: api-gateway
        run: ./mvnw clean test -B

      - name: Test Auth Service
        working-directory: services/auth-service
        run: ./mvnw clean test -B

      - name: Test Merchant Service
        working-directory: services/merchant-service
        run: ./mvnw clean test -B

      - name: Test Dispatch Service
        working-directory: services/dispatch-service
        run: ./mvnw clean test -B

      - name: Test Parcel Service
        working-directory: services/parcel-service
        run: ./mvnw clean test -B

      - name: Test Courier Service
        working-directory: services/courier-service
        run: ./mvnw clean test -B
