name: SwiftDrop Backend CI

on:
  push:
    branches: [ main, dev, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # webhook-service is an unused shell and its context test requires RabbitMQ.
        include:
          - name: API Gateway
            path: api-gateway
          - name: Auth Service
            path: services/auth-service
          - name: Merchant Service
            path: services/merchant-service
          - name: Parcel Service
            path: services/parcel-service
          - name: Pricing Service
            path: services/pricing-service
          - name: Dispatch Service
            path: services/dispatch-service
            postgres: true
          - name: Courier Service
            path: services/courier-service
          - name: Tracking Service
            path: services/tracking-service
          - name: Notification Service
            path: services/notification-service
          - name: Reporting Service
            path: services/reporting-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      # Dispatch migration tests start a private cluster with initdb. They do not use Neon.
      - name: Install PostgreSQL for dispatch migration tests
        if: matrix.postgres
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql

      - name: Run Maven tests
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B -ntp test
