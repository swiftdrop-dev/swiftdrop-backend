apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  namespace: swiftdrop
  labels:
    app.kubernetes.io/part-of: swiftdrop
type: Opaque
stringData:
  # Security Secrets
  JWT_SECRET: "replace-with-jwt-secret-at-least-256-bits"
  DISPATCH_SERVICE_TOKEN: "replace-with-dispatch-service-token"
  PARCEL_OTP_HMAC_SECRET: "replace-with-base64-encoded-hmac-secret"
  MERCHANT_WEBHOOK_ENCRYPTION_KEY: "replace-with-32-byte-hex-key"
  GOOGLE_CLIENT_ID: "replace-with-google-client-id"
  GEMINI_API_KEY: ""

  # RabbitMQ Credentials
  RABBITMQ_PASSWORD: "replace-with-rabbitmq-password"
  RABBITMQ_DEFAULT_PASS: "replace-with-rabbitmq-password"

  # PostgreSQL Credentials (Neon Cloud Pooler)
  AUTH_DB_PASSWORD: "replace-with-auth-db-password"
  PARCEL_DB_PASSWORD: "replace-with-parcel-db-password"
  PRICING_DB_PASSWORD: "replace-with-pricing-db-password"
  MERCHANT_DB_PASSWORD: "replace-with-merchant-db-password"
  MERCHANT_FLYWAY_PASSWORD: "replace-with-merchant-flyway-password"
  DISPATCH_DB_PASSWORD: "replace-with-dispatch-db-password"
  DISPATCH_FLYWAY_PASSWORD: "replace-with-dispatch-flyway-password"
  COURIER_DB_PASSWORD: "replace-with-courier-db-password"
  TRACKING_DB_PASSWORD: "replace-with-tracking-db-password"
  NOTIFICATION_DB_PASSWORD: "replace-with-notification-db-password"

  # External Integrations (Optional)
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
