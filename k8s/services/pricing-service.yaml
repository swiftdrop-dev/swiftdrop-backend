apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: pricing-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: pricing-service
          image: swiftdrop-backend-pricing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_NAME
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_USERNAME
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGSSLMODE
            - name: PRICING_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_URL
            - name: PRICING_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_USERNAME
            - name: PRICING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: PRICING_DB_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: PRICING_DB_PASSWORD
            - name: PARCEL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_SERVICE_URL
            - name: SERVICES_PARCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_PARCEL_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: pricing-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pricing-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
