apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: dispatch-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: dispatch-service
          image: swiftdrop-backend-dispatch-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: DISPATCH_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_DB_URL
            - name: DISPATCH_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_DB_USERNAME
            - name: DISPATCH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: DISPATCH_DB_PASSWORD
            - name: DISPATCH_FLYWAY_USER
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_FLYWAY_USER
            - name: DISPATCH_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: DISPATCH_FLYWAY_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: DISPATCH_DB_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_PORT
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: dispatch-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dispatch-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
