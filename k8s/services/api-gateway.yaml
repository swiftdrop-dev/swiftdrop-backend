apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: api-gateway
          image: swiftdrop-backend-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: GEMINI_API_KEY
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_SERVICE_URL
            - name: PARCEL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_SERVICE_URL
            - name: PRICING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_SERVICE_URL
            - name: MERCHANT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: MERCHANT_SERVICE_URL
            - name: DISPATCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DISPATCH_SERVICE_URL
            - name: COURIER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: COURIER_SERVICE_URL
            - name: TRACKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: TRACKING_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: NOTIFICATION_SERVICE_URL
            - name: REPORTING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: REPORTING_SERVICE_URL
            - name: SERVICES_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_AUTH_URL
            - name: SERVICES_PARCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_PARCEL_URL
            - name: SERVICES_PRICING_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_PRICING_URL
            - name: SERVICES_MERCHANT_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_MERCHANT_URL
            - name: SERVICES_DISPATCH_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_DISPATCH_URL
            - name: SERVICES_COURIER_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_COURIER_URL
            - name: SERVICES_TRACKING_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_TRACKING_URL
            - name: SERVICES_NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_NOTIFICATION_URL
            - name: SERVICES_REPORTING_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_REPORTING_URL
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
