apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: auth-service
          image: swiftdrop-backend-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_NAME
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_USERNAME
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGSSLMODE
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: AUTH_DB_PASSWORD
            - name: AUTH_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_URL
            - name: AUTH_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: AUTH_DB_USERNAME
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: CORS_ALLOWED_ORIGINS
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_VERIFY_ONLINE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: GOOGLE_VERIFY_ONLINE
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
