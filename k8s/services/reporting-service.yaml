apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: reporting-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: reporting-service
          image: swiftdrop-backend-reporting-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
            - name: SERVICES_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_AUTH_URL
            - name: SERVICES_PARCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_PARCEL_URL
            - name: SERVICES_PRICING_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_PRICING_URL
            - name: SERVICES_MERCHANT_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_MERCHANT_URL
            - name: SERVICES_DISPATCH_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_DISPATCH_URL
            - name: SERVICES_COURIER_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SERVICES_COURIER_URL
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: reporting-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reporting-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
