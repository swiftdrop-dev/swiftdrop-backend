apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: parcel-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parcel-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: parcel-service
          image: swiftdrop-backend-parcel-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JAVA_TOOL_OPTIONS
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_NAME
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_USERNAME
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PGSSLMODE
            - name: PARCEL_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_URL
            - name: PARCEL_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_USERNAME
            - name: PARCEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: PARCEL_DB_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PARCEL_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: PARCEL_DB_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_PORT
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: JWT_SECRET
            - name: PARCEL_OTP_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: PARCEL_OTP_HMAC_SECRET
            - name: PRICING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: PRICING_SERVICE_URL
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parcel-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: parcel-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: parcel-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
