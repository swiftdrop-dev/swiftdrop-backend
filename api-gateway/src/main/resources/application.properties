spring.application.name=api-gateway
server.port=8080
spring.profiles.active=local

# Database Configuration (PostgreSQL / Local Fallback)
spring.datasource.url=${GATEWAY_DB_URL:${PARCEL_DB_URL:jdbc:postgresql://localhost:5432/parcel_db}}
spring.datasource.username=${GATEWAY_DB_USERNAME:${PARCEL_DB_USERNAME:postgres}}
spring.datasource.password=${GATEWAY_DB_PASSWORD:${PARCEL_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Chatbot Configuration
chatbot.free-limit=4

# Google Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Microservice Route Targets
services.merchant.url=${MERCHANT_SERVICE_URL:http://localhost:8084}
services.dispatch.url=${DISPATCH_SERVICE_URL:http://localhost:8085}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

