spring.application.name=api-gateway
server.port=8080
spring.profiles.active=local

# Auth Service signs HS JWTs using this externally supplied key. No fallback is used.
gateway.security.jwt-secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Chatbot Configuration
chatbot.free-limit=4

# Google Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Microservice Route Targets
services.merchant.url=${MERCHANT_SERVICE_URL:http://localhost:8084}
services.dispatch.url=${DISPATCH_SERVICE_URL:http://localhost:8085}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}
services.courier.url=${COURIER_SERVICE_URL:http://localhost:8086}
services.pricing.url=${PRICING_SERVICE_URL:http://localhost:8083}

# Actuator Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

