spring.application.name=api-gateway-test
spring.datasource.url=jdbc:h2:mem:gateway_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Chatbot
chatbot.free-limit=4
gemini.api-key=test-gemini-key
gemini.model=gemini-3.8-flash
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Service Routes
services.merchant.url=http://localhost:8084
services.dispatch.url=http://localhost:8085
